name: Mise à jour des serveurs

# Après les tests réussis (CI) : fusion dans main → préproduction ; fusion dans production → production.
# Connexion SSH avec une clé qui ne peut lancer que deploy/update.sh (voir docs/MISE-A-JOUR-AUTOMATIQUE.md).
# Tant que les secrets ne sont pas enregistrés, la mise à jour est simplement sautée.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, production]
  workflow_dispatch:

# Une mise à jour à la fois par serveur ; une fusion arrivée entre-temps passe ensuite (jamais annulée en cours)
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'production' && 'Production' || 'Préproduction' }}
    # Seulement après des tests réussis sur une fusion (jamais pour une PR), ou lancé à la main
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'production')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      USER_NAME: ${{ secrets.DEPLOY_USER || 'lvdeploy' }}
      HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      KEY: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'production' && secrets.DEPLOY_KEY_PRODUCTION || secrets.DEPLOY_KEY_PREPROD }}
      SITE: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'production' && 'https://admin.jibiat.com' || 'https://preprod.jibiat.com' }}
    steps:
      - name: Secrets
        id: secrets
        run: |
          if [ -z "$HOST" ] || [ -z "$HOST_KEY" ] || [ -z "$KEY" ]; then
            echo "::notice::Mise à jour automatique pas encore configurée (secrets DEPLOY_*) : rien à faire."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Connexion
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Empreinte du serveur enregistrée dans les secrets : on ne se connecte qu'à lui
          if [ "$PORT" = "22" ]; then echo "$HOST $HOST_KEY"; else echo "[$HOST]:$PORT $HOST_KEY"; fi > ~/.ssh/known_hosts

      - name: Mise à jour
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # La clé lance d'elle-même deploy/update.sh sur le serveur (commande imposée côté serveur)
          ssh -T -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_NAME@$HOST" | tee deploy.log
          grep -q "Terminé" deploy.log || { echo "::error::La mise à jour ne s'est pas terminée."; exit 1; }
          deployed="$(grep 'Terminé' deploy.log | tail -n1 | sed 's/\x1b\[[0-9;]*m//g')"
          echo "::notice::${deployed#==> }"
          case "$deployed" in
            *"${SHA:0:7}"*) ;;
            *) echo "::warning::Le serveur affiche une autre version que ${SHA:0:7} (une fusion plus récente est peut-être déjà passée)." ;;
          esac

      - name: Vérification
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$SITE/up" || true)"
            [ "$code" = "200" ] && { echo "::notice::$SITE répond (200)."; exit 0; }
            sleep 10
          done
          echo "::error::$SITE/up ne répond pas 200 (dernier code : $code)."
          exit 1

      - name: Nettoyage
        if: always()
        run: rm -f ~/.ssh/deploy
