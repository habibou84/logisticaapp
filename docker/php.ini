; Réglages PHP de l'application (image Docker)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code ne change qu'avec une nouvelle image : pas de vérification des fichiers
opcache.validate_timestamps = 0
