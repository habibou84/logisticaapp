# Serveur web du conteneur « web » : fichiers de public/, PHP-FPM (conteneur « app ») et temps réel
# (conteneur « reverb »). Joignable seulement depuis le serveur (127.0.0.1), derrière Apache qui gère le HTTPS.

upstream php {
    server app:9000;
}

upstream reverb {
    server reverb:8080;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Photos de preuve, signatures, imports CSV/Excel
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Adresse réelle du visiteur, transmise par Apache
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    # Temps réel : WebSocket Laravel Reverb
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://reverb;
    }

    # Service worker des applications mobiles : jamais en cache (sinon les mises à jour n'arrivent pas)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers compilés par Vite (noms versionnés) : cache long
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Guide vidéo « Bien démarrer » (lecture par plages : Nginx s'en charge)
    location /videos/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
