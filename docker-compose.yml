# Application en conteneurs, sur un serveur qui héberge déjà d'autres sites (Apache, MySQL…).
# Rien n'est exposé sur Internet : seul le conteneur « web » écoute, sur 127.0.0.1:${APP_PORT},
# et Apache (HTTPS, certificat Let's Encrypt) lui transmet les visites (deploy/apache-site.conf).
#
#   bash deploy/install.sh / bash deploy/update.sh   # installation et mises à jour (migrations comprises)
#   docker compose exec -u www-data app php artisan …
#
# Les migrations ne s'appliquent pas au démarrage des conteneurs : elles passent avant, par
# « docker compose run --rm -e CONTAINER_ROLE=migrate app » (voir deploy/update.sh).
#
# Les valeurs ${…} viennent du fichier .env de l'application (même dossier).

name: ${COMPOSE_PROJECT_NAME:-logistica}

# Site, files d'attente, temps réel et tâches planifiées : la même image
x-app: &app
  # Une image par version (APP_VERSION, écrit dans .env par deploy/update.sh) : les précédentes restent sur le
  # serveur pour revenir en arrière en quelques secondes (deploy/rollback.sh)
  image: ${COMPOSE_PROJECT_NAME:-logistica}-app:${APP_VERSION:-latest}
  build:
    context: .
    target: app
    args: &build-args
      VITE_APP_NAME: ${APP_NAME:-Livraison}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
      # Commit installé (deploy/update.sh), transmis à Sentry
      APP_VERSION: ${APP_VERSION:-dev}
  restart: unless-stopped
  # Petit processus d'init : transmet l'arrêt (SIGTERM) à PHP, sinon ignoré par le processus n° 1 du conteneur
  # (Docker attendait alors 10 s avant de le tuer, à chaque mise à jour)
  init: true
  volumes:
    - ./.env:/var/www/html/.env:ro
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app
    # Prêt = démarrage terminé (/tmp/ready) et PHP-FPM accepte les connexions. Vérifié chaque seconde au
    # démarrage pour que la bascule d'une mise à jour soit la plus courte possible, puis toutes les 10 s.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 1s

  # Files d'attente : messages WhatsApp, notifications, webhooks, rapports
  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy

  # Temps réel (WebSocket) : alertes sonores, carte des livreurs, consignes
  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy

  # Tâches planifiées (alertes, rappels, paie, rapports) : chaque minute
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy

  web:
    image: ${COMPOSE_PROJECT_NAME:-logistica}-web:${APP_VERSION:-latest}
    build:
      context: .
      target: web
      args: *build-args
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    depends_on:
      app:
        condition: service_healthy

  # WhatsApp des alertes : numéro WhatsApp ordinaire relié en scannant un QR code (WAHA, moteur léger NOWEB).
  # Joignable seulement par les autres conteneurs (http://whatsapp-qr:3000), avec la clé WHATSAPP_QR_API_KEY.
  # La session reliée est gardée dans le volume « whatsapp-qr » : pas de nouveau scan après une mise à jour.
  whatsapp-qr:
    image: devlikeapro/waha:noweb-2026.10.1
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WHATSAPP_QR_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WHATSAPP_DOWNLOAD_MEDIA: "false"
      WAHA_LOG_LEVEL: warn
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - whatsapp-qr:/app/.sessions

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # Fichiers envoyés (logos, photos de preuve, imports) et journaux
  storage:
  postgres:
  redis:
  # Session du WhatsApp des alertes (QR code)
  whatsapp-qr:
