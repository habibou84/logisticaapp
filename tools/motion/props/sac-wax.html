<!doctype html>
<!-- Photo du produit pour la vidéo « une photo, une fiche » : sac en pagne wax posé sur une table -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 25%,#f4e7d3 0%,#e2cdb0 55%,#b8946b 100%)}
.table{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(180deg,#8a5a34,#6b4224);box-shadow:inset 0 30px 60px rgba(0,0,0,.25)}
.table:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 6px,rgba(0,0,0,.05) 6px 13px)}
.shadow{position:absolute;left:250px;top:930px;width:700px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0))}
.handle{position:absolute;left:400px;top:190px;width:400px;height:420px;border:34px solid #3b2516;border-bottom:none;border-radius:200px 200px 0 0;box-sizing:border-box}
.handle:after{content:"";position:absolute;inset:-34px;border:6px solid rgba(255,255,255,.12);border-bottom:none;border-radius:200px 200px 0 0}
.bag{position:absolute;left:230px;top:430px;width:740px;height:530px;border-radius:40px 40px 90px 90px;overflow:hidden;
 background-color:#f59e0b;
 background-image:
  radial-gradient(circle at 50% 50%,#1e3a8a 0 34px,transparent 35px),
  radial-gradient(circle at 50% 50%,#fde68a 0 52px,transparent 53px),
  radial-gradient(circle at 50% 50%,#c2410c 0 72px,transparent 73px),
  radial-gradient(circle at 0 0,#0f766e 0 40px,transparent 41px),
  radial-gradient(circle at 100% 100%,#0f766e 0 40px,transparent 41px),
  radial-gradient(circle at 100% 0,#0f766e 0 40px,transparent 41px),
  radial-gradient(circle at 0 100%,#0f766e 0 40px,transparent 41px);
 background-size:180px 180px;
 box-shadow:inset 0 -60px 90px rgba(0,0,0,.35),inset 0 40px 60px rgba(255,255,255,.18)}
.flap{position:absolute;left:230px;top:430px;width:740px;height:150px;border-radius:40px 40px 0 0;background:linear-gradient(180deg,#3b2516,#2a1a0f);box-shadow:0 14px 26px rgba(0,0,0,.35)}
.clasp{position:absolute;left:560px;top:545px;width:80px;height:70px;border-radius:14px;background:linear-gradient(135deg,#fde68a,#b45309);box-shadow:0 6px 12px rgba(0,0,0,.4)}
.stitch{position:absolute;left:250px;top:450px;width:700px;height:110px;border:3px dashed rgba(253,230,138,.55);border-top:none;border-radius:0 0 10px 10px}
.light{position:absolute;inset:0;background:radial-gradient(60% 50% at 30% 20%,rgba(255,255,255,.35),rgba(255,255,255,0))}
</style></head><body>
<div class="table"></div><div class="shadow"></div><div class="handle"></div><div class="bag"></div><div class="flap"></div><div class="stitch"></div><div class="clasp"></div><div class="light"></div>
</body></html>
