<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}svg{display:block}</style></head><body>
<div id="out"></div>
<script>
// Motifs wax : cercles concentriques, losanges, feuilles, bogolan
const P = {
  wax1: (id, a, b, c, d) => `<pattern id="${id}" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="${a}"/><circle cx="40" cy="40" r="30" fill="${b}"/><circle cx="40" cy="40" r="20" fill="${c}"/><circle cx="40" cy="40" r="9" fill="${d}"/><circle cx="0" cy="0" r="12" fill="${d}"/><circle cx="80" cy="0" r="12" fill="${d}"/><circle cx="0" cy="80" r="12" fill="${d}"/><circle cx="80" cy="80" r="12" fill="${d}"/></pattern>`,
  wax2: (id, a, b, c) => `<pattern id="${id}" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="${a}"/><path d="M30 4 L56 30 L30 56 L4 30Z" fill="${b}"/><path d="M30 16 L44 30 L30 44 L16 30Z" fill="${c}"/><circle cx="30" cy="30" r="4" fill="${a}"/></pattern>`,
  wax3: (id, a, b, c) => `<pattern id="${id}" width="90" height="90" patternUnits="userSpaceOnUse"><rect width="90" height="90" fill="${a}"/><ellipse cx="25" cy="25" rx="22" ry="10" transform="rotate(-35 25 25)" fill="${b}"/><ellipse cx="68" cy="65" rx="22" ry="10" transform="rotate(35 68 65)" fill="${b}"/><circle cx="68" cy="22" r="8" fill="${c}"/><circle cx="22" cy="68" r="8" fill="${c}"/></pattern>`,
  bogolan: (id) => `<pattern id="${id}" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#5b3a22"/><path d="M0 10H70M0 60H70" stroke="#e9dcc3" stroke-width="5"/><path d="M10 20 L20 35 L10 50 M30 20 L40 35 L30 50 M50 20 L60 35 L50 50" stroke="#e9dcc3" stroke-width="4" fill="none"/><circle cx="35" cy="5" r="2.5" fill="#e9dcc3"/><circle cx="35" cy="65" r="2.5" fill="#e9dcc3"/></pattern>`,
}
const shadow = `<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".22"/></filter>`
const bg = (c1, c2) => `<defs><radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>${shadow}</defs><rect width="1200" height="1200" fill="url(#bg)"/><ellipse cx="600" cy="1060" rx="330" ry="38" fill="#000" opacity=".08"/>`
const hanger = `<path d="M600 170 q0 -40 30 -40 q30 0 30 30 q0 22 -30 34 L600 205 L450 285 L750 285 Z" fill="none" stroke="#8a6a3c" stroke-width="10" stroke-linejoin="round"/>`
const dress = (fill, extra = '') => `<g filter="url(#sh)"><path d="M505 285 Q600 330 695 285 L720 300 L700 420 Q690 470 700 520 L860 1000 Q600 1060 340 1000 L500 520 Q510 470 500 420 L480 300 Z" fill="${fill}"/><path d="M500 520 Q600 545 700 520" stroke="#00000030" stroke-width="10" fill="none"/>${extra}</g>`
const ITEMS = {
  robe: () => `${bg('#fff4e6', '#f6d9b8')}<defs>${P.wax1('w', '#f28c28', '#1f3c88', '#ffd23f', '#e63946')}</defs>${hanger}${dress('url(#w)')}`,
  tabaski: () => `${bg('#f3efff', '#d9cff5')}<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3b2a7a"/><stop offset="1" stop-color="#241a52"/></linearGradient></defs>${hanger}<g filter="url(#sh)"><path d="M505 285 Q600 330 695 285 L760 320 L740 520 L820 1040 Q600 1080 380 1040 L460 520 L440 320 Z" fill="url(#g)"/><path d="M540 300 Q600 420 660 300" stroke="#e8c15a" stroke-width="12" fill="none"/><path d="M600 360 V640" stroke="#e8c15a" stroke-width="8" stroke-dasharray="4 14"/>${[0,1,2,3,4,5].map(i => `<circle cx="${560 + (i % 3) * 40}" cy="${430 + Math.floor(i / 3) * 70}" r="10" fill="#e8c15a"/>`).join('')}<path d="M400 1000 Q600 1040 800 1000" stroke="#e8c15a" stroke-width="10" fill="none"/></g>`,
  ensemble: () => `${bg('#eaf7ef', '#c7e8d3')}<defs>${P.wax2('w', '#0b6e4f', '#ffbf00', '#e4572e')}</defs><g filter="url(#sh)"><path d="M440 230 Q600 270 760 230 L860 330 L800 380 L760 340 L760 520 L440 520 L440 340 L400 380 L340 330 Z" fill="url(#w)"/><path d="M460 580 L740 580 L820 1010 Q600 1050 380 1010 Z" fill="url(#w)"/><rect x="460" y="575" width="280" height="22" fill="#0b6e4f"/></g>`,
  chemise: () => `${bg('#f5efe6', '#e2d3bd')}<defs>${P.bogolan('w')}</defs><g filter="url(#sh)"><path d="M470 230 L600 260 L730 230 L880 330 L820 470 L750 430 L750 1000 L450 1000 L450 430 L380 470 L320 330 Z" fill="url(#w)"/><path d="M560 250 L600 320 L640 250" fill="#e9dcc3"/><path d="M600 320 V990" stroke="#2f1d10" stroke-width="5"/>${[400, 520, 640, 760, 880].map(y => `<circle cx="615" cy="${y}" r="7" fill="#e9dcc3"/>`).join('')}</g>`,
  pagne: () => `${bg('#fff8e1', '#ffe2a8')}<defs>${P.wax1('w', '#2a9d8f', '#e76f51', '#f4a261', '#264653')}${P.wax3('v', '#6a1b9a', '#ffca3a', '#ff595e')}</defs><g filter="url(#sh)"><rect x="300" y="700" width="600" height="160" rx="22" fill="url(#v)"/><rect x="330" y="560" width="560" height="150" rx="22" fill="url(#w)" transform="rotate(-3 600 640)"/><rect x="360" y="420" width="500" height="150" rx="22" fill="url(#v)" transform="rotate(2 600 500)"/><path d="M360 470 h500" stroke="#ffffff55" stroke-width="6"/></g><g transform="translate(720 380) rotate(8)"><rect width="190" height="70" rx="10" fill="#fff"/><text x="95" y="46" font-family="Georgia,serif" font-size="30" font-weight="700" text-anchor="middle" fill="#7a1f1f">6 yards</text></g>`,
  sac: () => `${bg('#fff0f3', '#f9cdd6')}<defs>${P.wax3('w', '#ff6b35', '#004e89', '#ffd166')}</defs><g filter="url(#sh)"><path d="M470 420 Q470 250 600 250 Q730 250 730 420" stroke="#5c3d2e" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M360 420 L840 420 L800 960 Q600 990 400 960 Z" fill="url(#w)"/><rect x="360" y="420" width="480" height="60" fill="#5c3d2e"/></g>`,
  collier: () => `${bg('#eef6ff', '#cfe3fb')}<g filter="url(#sh)"><path d="M380 330 Q600 960 820 330" stroke="#c9a46a" stroke-width="6" fill="none"/>${Array.from({ length: 23 }, (_, i) => { const t = i / 22; const x = (1 - t) * (1 - t) * 380 + 2 * (1 - t) * t * 600 + t * t * 820; const y = (1 - t) * (1 - t) * 330 + 2 * (1 - t) * t * 960 + t * t * 330; const cols = ['#e63946', '#ffb703', '#219ebc', '#2a9d8f', '#fb8500', '#8338ec']; return `<circle cx="${x}" cy="${y}" r="${i === 11 ? 46 : 30}" fill="${cols[i % 6]}"/><circle cx="${x - 9}" cy="${y - 10}" r="${i === 11 ? 12 : 8}" fill="#fff" opacity=".45"/>` }).join('')}</g>`,
  foulard: () => `${bg('#f0fbff', '#c9ecf7')}<defs><linearGradient id="s" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d81b60"/><stop offset=".45" stop-color="#ff7aa8"/><stop offset=".55" stop-color="#ffd1e1"/><stop offset="1" stop-color="#ad1457"/></linearGradient></defs><g filter="url(#sh)"><path d="M300 360 Q600 260 900 360 Q820 560 900 760 Q600 680 520 960 Q420 700 300 760 Q380 560 300 360Z" fill="url(#s)"/><path d="M360 420 Q600 340 840 420" stroke="#ffffff70" stroke-width="10" fill="none"/></g>`,
  sandales: () => `${bg('#fbf3ea', '#ead2b8')}<g filter="url(#sh)">${[[440, -8], [760, 8]].map(([x, r]) => `<g transform="translate(${x} 640) rotate(${r})"><ellipse cx="0" cy="0" rx="120" ry="330" fill="#8d5524"/><ellipse cx="0" cy="0" rx="100" ry="305" fill="#c68642"/><path d="M-110 -120 Q0 -40 110 -120" stroke="#5a3311" stroke-width="44" fill="none" stroke-linecap="round"/><path d="M-105 40 Q0 110 105 40" stroke="#5a3311" stroke-width="40" fill="none" stroke-linecap="round"/><circle cx="0" cy="-70" r="16" fill="#e8c15a"/></g>`).join('')}</g>`,
  karite: () => `${bg('#fffbea', '#f3e3a6')}<g filter="url(#sh)"><rect x="390" y="360" width="420" height="80" rx="22" fill="#b07d2b"/><rect x="400" y="430" width="400" height="520" rx="60" fill="#f7efd8"/><rect x="400" y="560" width="400" height="230" fill="#2e7d32"/><text x="600" y="665" font-family="Georgia,serif" font-size="58" font-weight="700" text-anchor="middle" fill="#fff">Karité</text><text x="600" y="735" font-family="Arial" font-size="34" text-anchor="middle" fill="#e8f5e9">100 % naturel · 250 g</text></g><g opacity=".9">${[[300, 900], [880, 880], [860, 360]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="48" ry="34" fill="#a1662f"/><ellipse cx="${x - 12}" cy="${y - 10}" rx="14" ry="9" fill="#c98d4c"/>`).join('')}</g>`,
  pack: () => `${bg('#fff4e6', '#f6d9b8')}<defs>${P.wax1('w', '#f28c28', '#1f3c88', '#ffd23f', '#e63946')}${P.wax3('v', '#ff6b35', '#004e89', '#ffd166')}</defs><g transform="translate(-170 0)">${hanger}${dress('url(#w)')}</g><g transform="translate(560 420) scale(.62)" filter="url(#sh)"><path d="M470 420 Q470 250 600 250 Q730 250 730 420" stroke="#5c3d2e" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M360 420 L840 420 L800 960 Q600 990 400 960 Z" fill="url(#v)"/><rect x="360" y="420" width="480" height="60" fill="#5c3d2e"/></g><g transform="translate(840 210) rotate(10)"><circle r="95" fill="#e63946"/><text y="-8" font-family="Arial" font-size="40" font-weight="800" text-anchor="middle" fill="#fff">PACK</text><text y="38" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#fff">-3 000 F</text></g>`,
}
const hero = () => `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>${P.wax1('a', '#f28c28', '#1f3c88', '#ffd23f', '#e63946')}${P.wax2('b', '#0b6e4f', '#ffbf00', '#e4572e')}${P.wax3('c', '#6a1b9a', '#ffca3a', '#ff595e')}${P.wax1('d', '#2a9d8f', '#e76f51', '#f4a261', '#264653')}<linearGradient id="o" x1="0" x2="1"><stop offset="0" stop-color="#1b1b1b" stop-opacity=".5"/><stop offset="1" stop-color="#1b1b1b" stop-opacity=".42"/></linearGradient>${shadow}</defs><rect width="1600" height="900" fill="#f6e3c8"/>
<g filter="url(#sh)"><path d="M-40 120 Q400 40 820 140 Q1200 230 1680 120 L1680 360 Q1200 470 820 380 Q400 290 -40 380Z" fill="url(#a)"/><path d="M-40 360 Q420 300 840 400 Q1220 490 1680 380 L1680 620 Q1220 720 840 640 Q420 560 -40 620Z" fill="url(#b)"/><path d="M-40 600 Q420 540 840 640 Q1220 740 1680 620 L1680 940 L-40 940Z" fill="url(#c)"/></g>
<g transform="translate(1120 90) scale(.62)" filter="url(#sh)"><path d="M505 285 Q600 330 695 285 L720 300 L700 420 Q690 470 700 520 L860 1000 Q600 1060 340 1000 L500 520 Q510 470 500 420 L480 300 Z" fill="url(#d)"/></g>
<rect width="1600" height="900" fill="url(#o)"/></svg>`
const out = document.getElementById('out')
window.render = (name) => { out.innerHTML = name === 'hero' ? hero() : `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">${ITEMS[name]()}</svg>` }
window.NAMES = Object.keys(ITEMS)
</script></body></html>
