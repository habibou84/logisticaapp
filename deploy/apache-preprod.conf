# Préproduction de Jibiat sur le serveur Apache d'ISPConfig : la plateforme et toutes ses adresses
# __DOMAIN__ et *.__DOMAIN__ (console admin., entreprises de test). Copié dans
# /etc/apache2/sites-available/000-__INSTANCE__.conf par preprod.sh. ISPConfig ne gère pas ce fichier.
#
# Le nom « 000-… » le fait lire AVANT les sites d'ISPConfig (100-….vhost) : le site de production
# déclare « *.jibiat.com », qui couvrirait sinon aussi *.preprod.jibiat.com. Ne pas le renommer.

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias *.__DOMAIN__
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    ServerAlias *.__DOMAIN__
    DocumentRoot __APP_DIR__/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem

    <Directory __APP_DIR__/public>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
        CGIPassAuth On
    </Directory>

    # PHP-FPM dédié (utilisateur __USER__), voir php-fpm.conf
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php__PHP_V__-fpm-__INSTANCE__.sock|fcgi://__INSTANCE__"
    </FilesMatch>

    # Temps réel : Reverb écoute en local
    ProxyPass /app/ ws://127.0.0.1:__REVERB_PORT__/app/
    ProxyPassReverse /app/ ws://127.0.0.1:__REVERB_PORT__/app/

    # Jamais indexée, même pour les fichiers servis sans passer par l'application
    Header always set X-Robots-Tag "noindex, nofollow"

    LimitRequestBody 12582912
    ErrorLog ${APACHE_LOG_DIR}/__INSTANCE__-error.log
    CustomLog ${APACHE_LOG_DIR}/__INSTANCE__-access.log combined
</VirtualHost>
