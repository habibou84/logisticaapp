# Site Apache de l'application (copié dans /etc/apache2/sites-available/ par deploy/install.sh).
# __ADDR__, __DOMAIN__ et __PORT__ sont remplacés à l'installation.
#
# Apache garde le HTTPS (certificat Let's Encrypt) et transmet tout aux conteneurs Docker, qui
# n'écoutent que sur 127.0.0.1:__PORT__ ; le temps réel (WebSocket, /app/) passe par mod_proxy_wstunnel.

<VirtualHost __ADDR__>
    ServerName __DOMAIN__

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Photos de preuve, imports CSV/Excel (20 Mo)
    LimitRequestBody 26214400

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:__PORT__/$1 [P,L]

    ProxyPass / http://127.0.0.1:__PORT__/
    ProxyPassReverse / http://127.0.0.1:__PORT__/

    ErrorLog ${APACHE_LOG_DIR}/__DOMAIN__-error.log
    CustomLog ${APACHE_LOG_DIR}/__DOMAIN__-access.log combined
</VirtualHost>
