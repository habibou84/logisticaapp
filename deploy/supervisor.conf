; Processus permanents de l'application (copié dans /etc/supervisor/conf.d/ par install.sh).
; __INSTANCE__, __APP_DIR__, __PHP__, __USER__, __HOME__ et __REVERB_PORT__ sont remplacés à l'installation.

; Files d'attente (messages WhatsApp, notifications, webhooks, rapports)
[program:__INSTANCE__-horizon]
process_name=%(program_name)s
command=__PHP__ __APP_DIR__/artisan horizon
user=__USER__
environment=HOME="__HOME__"
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Temps réel (WebSocket) : alertes sonores, carte des livreurs, consignes
[program:__INSTANCE__-reverb]
process_name=%(program_name)s
command=__PHP__ __APP_DIR__/artisan reverb:start --host=127.0.0.1 --port=__REVERB_PORT__
user=__USER__
environment=HOME="__HOME__"
autostart=true
autorestart=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
